<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://github.com/MagicDippyEgg/magicdippyegg.github.io/blob/main/pfp.jpg?raw=true" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>404 - Page Not Found</h1>
    <p>Oops! This page doesn't exist.</p>
  </header>

  <main>
    <section>
      <p>The page you're looking for might have been removed, renamed, or doesn't exist.</p>
      <a href="https://magicdippyegg.vercel.app/">
        <button>Go Back Home</button>
      </a>
    </section>
  </main>

<footer>
  <p>Magic Dippy Egg Online <a href="contact.html">Contact Me</a></p>
</footer>

  <script>
    // Persistent Dark Mode Support
    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    if (isDarkMode) {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
