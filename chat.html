<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memepedia Chat</title>
  <link rel="icon" href="https://github.com/MagicDippyEgg/MEMEPEDIA-CONTENT/blob/main/icon.png?raw=true" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>Memepedia Chat</h1>
  <img src="https://github.com/MagicDippyEgg/MEMEPEDIA-CONTENT/blob/main/icon.png?raw=true" alt="Memepedia Logo" />
</header>

<main>
  <section>
    <h2>Back to Home</h2>
    <ul>
      <li><a href="index.html">Go Back Home</a></li>
    </ul>
  </section>

  <section>
    <h2>Chat</h2>
    <div class="chat-container">
      <div class="messages-container" id="messagesContainer"></div>
      <div class="input-container">
        <input type="text" id="memeInput" placeholder="Type your meme here..." />
        <button id="sendMeme">Send Meme</button>
      </div>
    </div>
  </section>

  <section>
    <h2>This page is linked to the #general section of the discord server</h2>
  </section>
</main>

<footer>
  <p>Created by #1 Logical Potato, with help from Magic Dippy Egg | Memepedia: Rebirth</p>
</footer>

<script>
  // Fetch messages
  async function fetchMessages() {
    try {
      const response = await fetch('https://memepedia-backend.vercel.app/api/get-latest-messages');
      if (!response.ok) throw new Error(`Error fetching messages: ${response.statusText}`);
      const data = await response.json();
      let messages = [];
      if (data && Array.isArray(data.messages)) {
        messages = data.messages;
      } else if (Array.isArray(data)) {
        messages = data;
      } else {
        document.getElementById('messagesContainer').innerHTML = 'No messages available';
        return;
      }
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        const author = msg.author?.username || msg.author || 'Unknown';
        const content = msg.content || '';
        msgDiv.innerHTML = `<span class="author">${author}</span>: <span class="content">${content}</span>`;
        container.appendChild(msgDiv);
      });
    } catch (err) {
      document.getElementById('messagesContainer').innerHTML = 'Failed to fetch messages';
      console.error(err);
    }
  }

  // Send message
  document.getElementById('sendMeme').addEventListener('click', async () => {
    const input = document.getElementById('memeInput');
    const content = input.value.trim();
    if (content) {
      try {
        const response = await fetch('https://memepedia-backend.vercel.app/api/send-to-discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        if (response.ok) {
          input.value = '';
          fetchMessages();
        } else {
          console.error('Failed to send meme');
        }
      } catch (err) {
        console.error('Error sending meme:', err);
      }
    }
  });

  // Initialize
  fetchMessages();
  setInterval(fetchMessages, 2000);
</script>
</body>
</html>
