<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Dippy Egg Online - AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Additional inline styles for chat layout if needed */
    .chat-section {
      margin-top: 20px;
    }
    .chat-container {
      background: #222;
      border-radius: 8px;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    #messagesContainer {
      height: 400px;
      overflow-y: auto;
      background: #333;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .message {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      max-width: 80%;
    }
    .message.user {
      background-color: #4CAF50;
      align-self: flex-end;
      color: #fff;
    }
    .message.bot {
      background-color: #2196F3;
      align-self: flex-start;
      color: #fff;
    }
    .input-group {
      display: flex;
    }
    #userInput {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #555;
      font-size: 16px;
    }
    #sendButton {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      background-color: #4a00e0;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    #sendButton:hover {
      background-color: #6a00f0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Magic Dippy Egg Online</h1>
	  <link rel="icon" href="https://github.com/MagicDippyEgg/magicdippyegg.github.io/blob/main/pfp.jpg?raw=true" type="image/jpeg">
	<p>Chat with an AI that is kinda forgetful at the moment!</p>
  </header>
  

  
  
  <main>
    <!-- Your existing sections (like home, other projects) can stay or be removed -->
    <!-- For focus, we'll just add the chat here -->
	          <section>
      <h2>Home</h2>
      <ul>
        <li><a href="index.html">Go Back Home</a></li>
      </ul>
    </section>
	
    <section class="chat-section">
      <h2 style="text-align:center;">Ask the AI Bot</h2>
      <div class="chat-container">
        <div id="messagesContainer"></div>
        <div class="input-group">
          <input type="text" id="userInput" placeholder="Ask something..." />
          <button id="sendButton">Send</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Magic Dippy Egg Online</p>
  </footer>
  
  <script>
    const messagesContainer = document.getElementById("messagesContainer");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");

    function appendMessage(content, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message " + sender;
      msgDiv.textContent = content;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;
      appendMessage(message, "user");
      userInput.value = "";

      try {
        const response = await fetch("https://memepedia-backend.vercel.app/api/gemini-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't get a response.";
        appendMessage(reply, "bot");
      } catch (error) {
        console.error(error);
        appendMessage("Error: Something went wrong. Please try again later.", "bot");
      }
    }

    document.getElementById("sendButton").addEventListener("click", sendMessage);
    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
	
	  // Check if dark mode was previously enabled and apply it
  const isDarkMode = localStorage.getItem('darkMode') === 'true';
  if (isDarkMode) {
    document.body.classList.add('dark-mode');
  }

  const toggleButton = document.getElementById('darkModeToggle');
  toggleButton.addEventListener('click', () => {
    // Toggle dark mode
    document.body.classList.toggle('dark-mode');
    
    // Save the dark mode state to localStorage
    const darkModeEnabled = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', darkModeEnabled);
  });
  </script>
</body>
</html>
