<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: #1a1a1a; /* Dark background */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e0e0e0;
        }

        canvas {
            display: block;
            background-color: #2c2c2c; /* Slightly lighter background for the grid */
            border-radius: 8px; /* Rounded corners for the canvas */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Soft shadow */
            max-width: 100vw;
            max-height: 100vh;
        }

        #message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none; /* Hidden by default */
            text-align: center;
            font-size: 1.1em;
        }

        #message-box button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        #message-box button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="message-box">
        <p id="message-content"></p>
        <button onclick="hideMessageBox()">OK</button>
    </div>

    <script>
        // Get the canvas element and its 2D rendering context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Define cell size and grid dimensions
        const cellSize = 10; // Size of each cell in pixels
        let numCols; // Number of columns in the grid
        let numRows; // Number of rows in the grid
        let grid; // The 2D array representing the game grid

        // Function to display a custom message box
        function showMessageBox(message) {
            const messageBox = document.getElementById('message-box');
            const messageContent = document.getElementById('message-content');
            messageContent.textContent = message;
            messageBox.style.display = 'block';
        }

        // Function to hide the custom message box
        function hideMessageBox() {
            document.getElementById('message-box').style.display = 'none';
        }

        /**
         * Initializes the grid dimensions based on the canvas size
         * and populates the grid with random live/dead cells.
         */
        function initializeGrid() {
            // Calculate number of columns and rows based on canvas size and cell size
            numCols = Math.floor(canvas.width / cellSize);
            numRows = Math.floor(canvas.height / cellSize);

            // Create a new 2D array (grid)
            grid = new Array(numRows);
            for (let i = 0; i < numRows; i++) {
                grid[i] = new Array(numCols);
                // Populate the grid with random 0s (dead) or 1s (live)
                for (let j = 0; j < numCols; j++) {
                    grid[i][j] = Math.random() > 0.7 ? 1 : 0; // Approximately 30% live cells initially
                }
            }
        }

        /**
         * Draws the current state of the grid on the canvas.
         */
        function drawGrid() {
            // Clear the entire canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Iterate over each cell in the grid
            for (let i = 0; i < numRows; i++) {
                for (let j = 0; j < numCols; j++) {
                    // If the cell is alive (value is 1)
                    if (grid[i][j] === 1) {
                        ctx.fillStyle = '#4CAF50'; // Green color for live cells
                        // Draw a filled rectangle for the cell
                        ctx.fillRect(j * cellSize, i * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
        }

        /**
         * Updates the grid to the next generation based on Conway's Game of Life rules.
         */
        function updateGrid() {
            // Create a new grid to store the next state, preventing issues from modifying in place
            const nextGrid = new Array(numRows);
            for (let i = 0; i < numRows; i++) {
                nextGrid[i] = new Array(numCols);
            }

            // Iterate over each cell in the current grid
            for (let i = 0; i < numRows; i++) {
                for (let j = 0; j < numCols; j++) {
                    let liveNeighbors = 0;

                    // Check all 8 neighbors (including diagonals)
                    for (let x = -1; x <= 1; x++) {
                        for (let y = -1; y <= 1; y++) {
                            // Skip the cell itself
                            if (x === 0 && y === 0) continue;

                            // Calculate neighbor's coordinates
                            const neighborRow = i + x;
                            const neighborCol = j + y;

                            // Check if the neighbor is within the grid boundaries
                            if (neighborRow >= 0 && neighborRow < numRows &&
                                neighborCol >= 0 && neighborCol < numCols) {
                                // If the neighbor is alive, increment liveNeighbors count
                                liveNeighbors += grid[neighborRow][neighborCol];
                            }
                        }
                    }

                    // Apply Conway's Game of Life rules
                    if (grid[i][j] === 1) { // If the current cell is alive
                        if (liveNeighbors < 2 || liveNeighbors > 3) {
                            nextGrid[i][j] = 0; // Dies due to underpopulation or overpopulation
                        } else {
                            nextGrid[i][j] = 1; // Lives on
                        }
                    } else { // If the current cell is dead
                        if (liveNeighbors === 3) {
                            nextGrid[i][j] = 1; // Becomes alive due to reproduction
                        } else {
                            nextGrid[i][j] = 0; // Remains dead
                        }
                    }
                }
            }
            // Update the main grid with the next generation's state
            grid = nextGrid;
        }

        /**
         * The main animation loop.
         * It updates the grid and redraws it continuously.
         */
        let lastUpdateTime = 0;
        const animationInterval = 100; // Update every 100 milliseconds (10 frames per second)

        function animate(currentTime) {
            // Request the next animation frame
            requestAnimationFrame(animate);

            // Only update and draw if enough time has passed since the last update
            if (currentTime - lastUpdateTime > animationInterval) {
                lastUpdateTime = currentTime;
                updateGrid(); // Calculate the next generation
                drawGrid();   // Draw the updated grid
            }
        }

        /**
         * Handles window resizing.
         * Adjusts canvas dimensions and re-initializes the grid.
         */
        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initializeGrid(); // Re-initialize grid with new dimensions
            drawGrid(); // Draw the new grid immediately
        }

        // Add event listener for window resize
        window.addEventListener('resize', handleResize);

        // Start the animation when the window loads
        window.onload = function () {
            handleResize(); // Set initial canvas size and grid
            animate();      // Start the animation loop
        };
    </script>
</body>
</html>
