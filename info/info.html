  <style>
    /* Styling for the video container for rounded corners and shadow */
    .styled-video-container {
        /* This background ensures the corners are visible */
        background-color: #f4f4f4; 
        border-radius: 12px;
        /* Subtle purple glow for a stylized look */
        box-shadow: 0 4px 15px rgba(74, 0, 224, 0.4), 
                    0 0 0 2px rgba(74, 0, 224, 0.1); /* Thin border-like line */
        overflow: hidden; /* Ensures the video corners are rounded with the container */
        margin: 20px 0;
        transition: box-shadow 0.3s ease-in-out;
    }

    /* Dark mode adjustments for the container */
    body.dark-mode .styled-video-container {
        background-color: #222; 
        /* Adjust shadow for dark mode to be lighter */
        box-shadow: 0 4px 15px rgba(106, 0, 240, 0.5), 
                    0 0 0 2px rgba(106, 0, 240, 0.2); 
    }

    /* Target the video element itself to ensure it fills the container and has a subtle shadow on its own */
    .styled-video-container video {
        display: block; /* Removes any extra spacing below the video */
    }
  </style>

  <script>
  // Check if dark mode was previously enabled and apply it
  const isDarkMode = localStorage.getItem('darkMode') === 'true';
  if (isDarkMode) {
    document.body.classList.add('dark-mode');
  }

  const toggleButton = document.getElementById('darkModeToggle');
  // NOTE: I didn't see a 'darkModeToggle' element in your provided HTML, 
  // but I kept the script logic assuming it exists elsewhere or will be added.
  if (toggleButton) {
      toggleButton.addEventListener('click', () => {
        // Toggle dark mode
        document.body.classList.toggle('dark-mode');
        
        // Save the dark mode state to localStorage
        const darkModeEnabled = document.body.classList.contains('dark-mode');
        localStorage.setItem('darkMode', darkModeEnabled);
      });
  }
</script>
