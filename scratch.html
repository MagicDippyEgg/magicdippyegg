<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scratch - Magic Dippy Egg Online</title>
    <meta property="og:site_name" content="Magic Dippy Egg Online">
	<meta name="application-name" content="Magic Dippy Egg Online">
    <link rel="icon" href="/icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Scratch Account</h1>
    <p>Here is some info about my scratch account!</p>
  </header>
  


  <main>
        <section>
      <h2>Home</h2>
      <ul>
        <li><a href="/">Go Back Home</a></li>
      </ul>
    </section>
	
	
  
<section id="scratch-info">
  <h2>My Scratch Info</h2>
  <a href="https://scratch.mit.edu/users/MagicDippyEgg/">Visit My Scratch</a> <br>
  <img id="scratch-pfp" src="" alt="Profile picture" width="90" height="90">
  <p><strong>Username:</strong> <span id="scratch-username"></span></p>
  <p><strong>About Me:</strong> <span id="scratch-bio"></span></p>
  <p><strong>What I'm Working On:</strong> <span id="scratch-status"></span></p>
  <p><strong>Joined Scratch on:</strong> <span id="scratch-joined"></span></p>
</section>





<footer>
  <p>Magic Dippy Egg Online <a href="contact">Contact Me</a></p>
</footer>

<script data-goatcounter="https://magicdippyegg.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  
<script>
  // Dark mode toggle setup
  const isDarkMode = localStorage.getItem('darkMode') === 'true';
  if (isDarkMode) {
    document.body.classList.add('dark-mode');
  }

  const toggleButton = document.getElementById('darkModeToggle');
  if (toggleButton) {
    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const darkModeEnabled = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', darkModeEnabled);
    });
  }

fetch("/api/scratch")
  .then(response => response.json())
  .then(data => {
    document.getElementById("scratch-username").textContent = data.username;
    document.getElementById("scratch-bio").textContent = data.profile.bio;
    document.getElementById("scratch-status").textContent = data.profile.status;

    const joinedDate = new Date(data.history.joined);
    document.getElementById("scratch-joined").textContent = joinedDate.toDateString();
    document.getElementById("scratch-pfp").src = data.profile.images["90x90"];
  })
  .catch(error => {
    console.error("Error fetching Scratch profile data:", error);
    const infoSection = document.getElementById("scratch-info");
    if (infoSection) {
      infoSection.innerHTML += "<p style='color:red;'>Failed to load Scratch data.</p>";
    }
  });



</script>

</body>
</html>
