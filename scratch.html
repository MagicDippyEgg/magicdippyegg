<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scratch - Magic Dippy Egg Online</title>
    <link rel="icon" href="https://github.com/MagicDippyEgg/magicdippyegg.github.io/blob/main/pfp.jpg?raw=true" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Scratch Account</h1>
    <p>Here is some info about my scratch account!</p>
  </header>
  


  <main>
        <section>
      <h2>Home</h2>
      <ul>
        <li><a href="index.html">Go Back Home</a></li>
      </ul>
    </section>
  
<section id="scratch-info">
  <h2>Scratch Info</h2>
  <img id="scratch-pfp" src="" alt="Profile picture" width="90" height="90"><br>
  <strong>Username:</strong> <span id="scratch-username"></span><br>
  <strong>About Me:</strong> <span id="scratch-bio"></span><br>
  <strong>What I'm Working On:</strong> <span id="scratch-status"></span><br>
  <strong>Joined:</strong> <span id="scratch-joined"></span><br>
  <strong>Followers:</strong> <span id="scratch-followers"></span><br>
  <strong>Projects:</strong> <span id="scratch-projects"></span><br>
</section>



  <footer>
    <p>© 2025 Magic Dippy Egg Online</p>
  </footer>
  
<script>
  // Dark mode toggle setup
  const isDarkMode = localStorage.getItem('darkMode') === 'true';
  if (isDarkMode) {
    document.body.classList.add('dark-mode');
  }

  const toggleButton = document.getElementById('darkModeToggle');
  if (toggleButton) {
    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const darkModeEnabled = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', darkModeEnabled);
    });
  }

  // Fetch and display Scratch user info
fetch("/api/scratch")
  .then(response => response.json())
  .then(data => {
    document.getElementById("scratch-username").textContent = data.username;
    document.getElementById("scratch-bio").textContent = data.profile.bio;
    document.getElementById("scratch-status").textContent = data.profile.status;

    const joinedDate = new Date(data.history.joined);
    document.getElementById("scratch-joined").textContent = joinedDate.toDateString();
    document.getElementById("scratch-pfp").src = data.profile.images["90x90"];
  })
  .catch(error => {
    console.error("Error fetching Scratch profile data:", error);
    const infoSection = document.getElementById("scratch-info");
    if (infoSection) {
      infoSection.innerHTML += "<p style='color:red;'>Failed to load Scratch data.</p>";
    }
  });

</script>

</body>
</html>
